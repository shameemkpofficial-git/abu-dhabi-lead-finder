name: Daily Lead Finder

on:
  workflow_dispatch:

  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  find-leads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Search Google Places
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          python src/main.py

      - name: Check websites
        run: |
          python src/website.py

      - name: Detect online booking
        run: |
          python src/booking.py

      - name: Calculate lead scores
        run: |
          python src/scoring.py

      - name: Send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/telegram.py

      - name: Test Gmail
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          python src/gmail.py

      - name: Commit updated leads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/leads.csv

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily salon leads"
            git push
          fi